name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The Mill jobs, the Mill vs Bazel build comparison and the release are temporarily
  # disabled (only the Bazel jobs run): set the repository variable ENABLE_MILL_CI to
  # `true` (Settings > Secrets and variables > Actions > Variables) to run them again.
  changes:
    uses: ./.github/workflows/changes.yml

  jvm:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/jvm.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_integration: ${{ needs.changes.outputs.test_integration }}
      test_skip: ${{ needs.changes.outputs.test_skip }}

  bazel:
    needs: [changes]
    uses: ./.github/workflows/bazel.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      docs: ${{ needs.changes.outputs.docs }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_integration: ${{ needs.changes.outputs.test_integration }}
      test_docs: ${{ needs.changes.outputs.test_docs }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}
      test_native: ${{ needs.changes.outputs.test_native }}

  linux:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}
      test_lts_all_platforms: ${{ needs.changes.outputs.test_lts_all_platforms }}

  macos:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}
      test_lts_all_platforms: ${{ needs.changes.outputs.test_lts_all_platforms }}

  windows:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}

  windows-arm64:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/windows-arm64.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}

  static:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/static.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}
      test_lts_all_platforms: ${{ needs.changes.outputs.test_lts_all_platforms }}

  mostly-static:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/mostly-static.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      ci: ${{ needs.changes.outputs.ci }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_native: ${{ needs.changes.outputs.test_native }}
      test_skip: ${{ needs.changes.outputs.test_skip }}
      test_legacy_lts: ${{ needs.changes.outputs.test_legacy_lts }}
      test_lts_all_platforms: ${{ needs.changes.outputs.test_lts_all_platforms }}

  misc:
    needs: [changes]
    if: vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/misc.yml
    secrets: inherit
    with:
      code: ${{ needs.changes.outputs.code }}
      docs: ${{ needs.changes.outputs.docs }}
      ci: ${{ needs.changes.outputs.ci }}
      format_config: ${{ needs.changes.outputs.format_config }}
      benchmark: ${{ needs.changes.outputs.benchmark }}
      gifs: ${{ needs.changes.outputs.gifs }}
      mill_wrapper: ${{ needs.changes.outputs.mill_wrapper }}
      test_all: ${{ needs.changes.outputs.test_all }}
      test_docs: ${{ needs.changes.outputs.test_docs }}
      test_format: ${{ needs.changes.outputs.test_format }}
      test_skip: ${{ needs.changes.outputs.test_skip }}

  # Mill vs Bazel shadow build: durations and test counts of paired jobs (see bazel/README.md).
  # Informational only: never fails, and the release job doesn't depend on it.
  build-comparison:
    needs: [changes, jvm, linux, macos, windows, static, mostly-static, misc, bazel]
    if: always() && vars.ENABLE_MILL_CI == 'true' && needs.changes.outputs.test_skip != 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Download test reports
      uses: actions/download-artifact@v8
      with:
        pattern: "*test-results-*"
        path: reports/
    - name: Fetch job timings
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh api --paginate
        "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100"
        > jobs.json
    - name: Compare Mill and Bazel
      run: |
        python3 -I .github/scripts/compare-build-systems.py jobs.json reports/ \
          --json "build-comparison-${{ github.run_id }}-${{ github.run_attempt }}.json" \
          | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: build-comparison
        path: build-comparison-*.json
        retention-days: 90

  release:
    needs: [changes, jvm, linux, macos, windows, windows-arm64, static, mostly-static, misc]
    if: github.event_name == 'push' && vars.ENABLE_MILL_CI == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
