name: Bazel (shadow)
# Shadow CI for the Bazel build, which lives alongside Mill (see bazel/README.md).
#
# Every job here mirrors a Mill job: same job id, same step names for the equivalent
# steps, and test reports uploaded as `bazel-test-results-<job id>` (Mill uploads
# `test-results-<job id>`). The `build-comparison` job in ci.yml pairs them to compare
# durations and test counts over time (.github/scripts/compare-build-systems.py).
#
# Shadow: jobs use continue-on-error and nothing (in particular the release job)
# depends on this workflow, so Bazel failures never block CI or releases.
on:
  workflow_call:
    inputs:
      code:
        type: string
        required: true
      ci:
        type: string
        required: true
      docs:
        type: string
        required: true
      test_all:
        type: string
        required: true
      test_integration:
        type: string
        required: true
      test_docs:
        type: string
        required: true
      test_skip:
        type: string
        required: true
      test_legacy_lts:
        type: string
        required: true

env:
  BAZEL_FLAGS: --config=ci

jobs:
  # jvm.yml: unit-tests
  unit-tests:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.test_all == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Bazel unit tests -- changes do not affect compiled code or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
    # Host JDK, as in jvm.yml (scala-cli-setup jvm: zulu:25); CompromisedCaTests checks its trust store.
    - uses: actions/setup-java@v6
      if: env.SHOULD_RUN == 'true'
      with:
        distribution: zulu
        java-version: 25
    # JDK used by the tests (Mill's ScalaCliTests.jvmVersion: temurin:17).
    - uses: actions/setup-java@v6
      if: env.SHOULD_RUN == 'true'
      with:
        distribution: temurin
        java-version: 17
    - uses: bazel-contrib/setup-bazel@0.19.1
      if: env.SHOULD_RUN == 'true'
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-unit-tests
        repository-cache: true
    # Mill: `copyJvmLauncher` + `copyJvmBootstrappedLauncher`
    - name: Copy launcher
      if: env.SHOULD_RUN == 'true'
      run: bazel build $BAZEL_FLAGS //modules/cli:scala-cli-standalone-jar //modules/cli:scala-cli-bootstrapped-jar
    # Mill: `./mill -i '__[_].compile'`
    - name: Cross compile everything
      if: env.SHOULD_RUN == 'true'
      run: bazel build $BAZEL_FLAGS //...
    # Mill: `./mill -i unitTests`
    - name: Unit tests
      if: env.SHOULD_RUN == 'true'
      run: >
        bazel test $BAZEL_FLAGS
        --test_env=JAVA_HOME=$JAVA_HOME_17_X64
        --test_env=SCALA_CLI_TESTS_HOST_JAVA_HOME=$JAVA_HOME_25_X64
        //:unit_tests
    - name: Collect test reports
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      run: .github/scripts/collect-bazel-test-reports.sh bazel-test-reports
    - name: Upload test report
      uses: actions/upload-artifact@v7
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      with:
        name: bazel-test-results-unit-tests
        path: bazel-test-reports/
        if-no-files-found: ignore

  # jvm.yml: jvm-tests-* and jvm-bootstrapped-tests-default
  jvm-tests:
    name: ${{ matrix.job }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same jobs and SCALA_CLI_IT_GROUP split as jvm.yml
          - { job: jvm-tests-default, target: jvm, group: 1 }
          - { job: jvm-tests-scala-2-13, target: jvm, group: 2 }
          - { job: jvm-tests-scala-2-12, target: jvm, group: 3 }
          - { job: jvm-tests-lts, target: jvm, group: 4 }
          - { job: jvm-tests-rc, target: jvm, group: 5 }
          - { job: jvm-tests-legacy-lts, target: jvm, group: 6, legacy_lts: true }
          - { job: jvm-bootstrapped-tests-default, target: jvmBootstrapped, group: 1 }
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.test_all == 'true' || inputs.test_integration == 'true') && inputs.test_skip != 'true' && (!matrix.legacy_lts || inputs.test_legacy_lts == 'true') }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Bazel JVM integration tests (${{ matrix.job }})."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      if: env.SHOULD_RUN == 'true'
      with:
        distribution: temurin
        java-version: 17
    - uses: actions/setup-node@v7
      if: env.SHOULD_RUN == 'true'
      with:
        node-version: 24
    - uses: bazel-contrib/setup-bazel@0.19.1
      if: env.SHOULD_RUN == 'true'
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-jvm-tests
        repository-cache: true
    # Mill: `./mill -i integration.test.jvm` / `integration.test.jvmBootstrapped`
    - name: JVM integration tests
      if: env.SHOULD_RUN == 'true'
      run: >
        bazel test $BAZEL_FLAGS
        --test_env=JAVA_HOME --test_env=PATH --test_env=HOME --test_env=CI
        --test_env=SCALA_CLI_IT_GROUP=${{ matrix.group }}
        //modules/integration:${{ matrix.target }}
    - name: Collect test reports
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      run: .github/scripts/collect-bazel-test-reports.sh bazel-test-reports
    - name: Upload test report
      uses: actions/upload-artifact@v7
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      with:
        name: bazel-test-results-${{ matrix.job }}
        path: bazel-test-reports/
        if-no-files-found: ignore

  # misc.yml: docs-tests
  docs-tests:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.docs == 'true' || inputs.ci == 'true' || inputs.test_all == 'true' || inputs.test_docs == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Bazel docs tests -- changes do not affect code, docs, or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      if: env.SHOULD_RUN == 'true'
      with:
        distribution: temurin
        java-version: 17
    - uses: bazel-contrib/setup-bazel@0.19.1
      if: env.SHOULD_RUN == 'true'
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-docs-tests
        repository-cache: true
    # Mill: `./mill -i 'docs-tests[]'.test`
    - name: Test documentation
      if: env.SHOULD_RUN == 'true'
      run: >
        bazel test $BAZEL_FLAGS
        --test_env=JAVA_HOME --test_env=PATH --test_env=HOME --test_env=CI
        //modules/docs-tests:test
    - name: Collect test reports
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      run: .github/scripts/collect-bazel-test-reports.sh bazel-test-reports
    - name: Upload test report
      uses: actions/upload-artifact@v7
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      with:
        name: bazel-test-results-docs-tests
        path: bazel-test-reports/
        if-no-files-found: ignore

  # misc.yml: reference-doc
  reference-doc:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.docs == 'true' || inputs.ci == 'true' || inputs.test_all == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Bazel reference doc check -- changes do not affect code, docs, or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
    - uses: bazel-contrib/setup-bazel@0.19.1
      if: env.SHOULD_RUN == 'true'
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-reference-doc
        repository-cache: true
    # Mill: `./mill -i 'generate-reference-doc[]'.run --check`
    - name: Check that reference doc is up-to-date
      if: env.SHOULD_RUN == 'true'
      run: |
        bazel run $BAZEL_FLAGS //modules/generate-reference-doc -- --check || (
          echo "Reference doc is not up-to-date. Run"
          echo "  bazel run //modules/generate-reference-doc"
          echo "to update it, then commit the result."
          exit 1
        )
